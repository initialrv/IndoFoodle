<!DOCTYPE html>
<html lang="en">

<head>
  <!-- // page setup -->
  <meta charset="UTF-8">
  <title>IndoFoodle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png?v=2">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png?v=2">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2">

  <!-- // fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap">

  <!-- // styles -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="menu-active">

  <!-- // shared top navigation -->
  <header class="topbar">

    <!-- // centered logo -->
    <div class="topbar-center">
      <button id="topbar-logo-btn" class="topbar-logo-btn" type="button" aria-label="Back to main menu">
        <img
          src="assets/logo.png"
          alt="IndoFoodle"
          class="topbar-logo"
        >
      </button>
    </div>

  </header>


  <!-- // main menu screen -->
  <main id="menu-screen">

    <!-- // main menu logo -->
    <img
      src="assets/logo.png"
      alt="IndoFoodle Logo"
      class="main-logo"
    >

    <p class="subtitle">
      Which Indonesian traditional food would most people choose?
    </p>

    <p class="description">
      Pick between two foods and try to match the majority vote.
      You'll face daily matchups from across Indonesia.
    </p>

    <div class="menu-actions">
      <button id="start-btn">
        Start Game
      </button>

      <button id="practice-btn">
        Practice Mode
      </button>
    </div>

    <p class="daily-text">
      Fresh matchups daily
    </p>

  </main>


  <!-- // warm-up screen -->
  <main id="warmup-screen" hidden>

    <p class="subtitle">
      Warm-up Vote
    </p>

    <div class="cards">

      <button id="warmup-left-card" class="card"></button>

      <button id="warmup-right-card" class="card"></button>

    </div>

  </main>


  <!-- // game screen -->
  <main id="game-screen" hidden>

    <div id="progress">
      Question 1/10
    </div>

    <div class="cards">

      <button id="left-card" class="card"></button>

      <button id="right-card" class="card"></button>

    </div>

  </main>


  <!-- // result screen -->
  <main id="result-screen" hidden>

    <!-- // result hero summary -->
    <section class="result-hero">

      <p id="final-score" class="final-score" aria-live="polite"></p>

      <div id="result-dots" class="result-dots"></div>

      <p id="final-message" class="final-message" aria-live="polite"></p>

    </section>

    <!-- // round matchup breakdown -->
    <div id="matchup-breakdown" class="matchup-breakdown"></div>

    <!-- // result action buttons -->
    <div class="result-actions">

      <button id="copy-result-btn">
        Copy Result
      </button>

      <button id="restart-btn">
        Back to Menu
      </button>

    </div>

  </main>


  <!-- // modal popup -->
  <div id="modal" class="modal" hidden>

    <div class="modal-box">

      <p id="modal-text"></p>

      <div id="modal-copy-panel" class="modal-copy-panel" hidden>
        <p id="modal-copy-value" class="modal-copy-value"></p>

        <button
          id="modal-copy-btn"
          class="modal-copy-btn"
          type="button"
          aria-label="Copy result"
        >
          <svg
            aria-hidden="true"
            viewBox="0 0 24 24"
            class="modal-copy-icon"
          >
            <path d="M8 7H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2" />
            <path d="M8 3h9a2 2 0 0 1 2 2v9" />
            <path d="M8 3a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2" />
          </svg>
        </button>
      </div>

      <textarea
        id="modal-copy-text"
        class="modal-copy-text"
        readonly
        hidden
      ></textarea>

      <button id="modal-btn">
        OK
      </button>

    </div>

  </div>


  <!-- // javascript -->
  <script src="js/state.js"></script>
  <script src="js/game-data.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/dom.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/results.js"></script>
  <script src="js/warmup-flow.js"></script>
  <script src="js/game-flow.js"></script>
  <script src="js/script.js"></script>

</body>

</html>
