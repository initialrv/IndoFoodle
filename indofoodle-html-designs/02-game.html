<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>IndoFoodle — Game Screen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #1A0E07;
      --surface:  #2A1608;
      --surface2: #3A2010;
      --text:     #F0E0C8;
      --muted:    #8A6545;
      --primary:  #E63946;
      --accent:   #F4A261;
      --border:   #4A2E18;
      --correct:  #4CAF50;
      --wrong:    #EF4444;
      --dot-next: #3A2A1A;
      --dot-curr: #4A9EFF;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      width: 1280px;
      height: 800px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 40px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .menu-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .round-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    /* ── Progress Dots ── */
    .progress-dots {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      border-radius: 50%;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .dot-next    { width: 10px; height: 10px; background: var(--dot-next); }
    .dot-correct { width: 10px; height: 10px; background: var(--correct); }
    .dot-wrong   { width: 10px; height: 10px; background: var(--wrong); }
    .dot-current {
      width: 14px; height: 14px;
      background: var(--dot-curr);
      animation: dotPulse 2s ease-in-out infinite;
    }

    @keyframes dotPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(74,158,255,0.4); }
      50%       { box-shadow: 0 0 0 4px rgba(74,158,255,0.15); }
    }

    /* ── Game Prompt ── */
    .game-prompt {
      text-align: center;
      padding: 18px 0 12px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      flex-shrink: 0;
    }

    /* ── Cards Area ── */
    main {
      flex: 1;
      display: flex;
      padding: 0 32px 32px;
      gap: 0;
      position: relative;
      min-height: 0;
    }

    .food-card {
      flex: 1;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .food-card:hover {
      transform: scale(1.012);
      box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 0 3px var(--accent);
    }

    .food-card:first-child { margin-right: 24px; }
    .food-card:last-child  { margin-left: 24px; }

    .food-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .card-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.18) 55%, rgba(0,0,0,0.1) 100%);
    }

    .region-badge {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 6px 14px;
      border-radius: 999px;
    }

    .card-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 28px;
    }

    .card-info h2 {
      font-size: 40px;
      font-weight: 900;
      color: #fff;
      letter-spacing: -1px;
      margin-bottom: 6px;
      line-height: 1;
    }

    .card-info p {
      font-size: 15px;
      color: rgba(255,255,255,0.78);
      line-height: 1.4;
    }

    /* ── VS Badge ── */
    .vs-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      width: 56px;
      height: 56px;
      background: var(--bg);
      border: 4px solid var(--bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      color: var(--primary);
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <header>
    <button class="menu-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Menu
    </button>

    <!-- Dots: 2 correct, 1 wrong, 1 current (blue), 6 next -->
    <div class="progress-dots">
      <div class="dot dot-correct"></div>
      <div class="dot dot-wrong"></div>
      <div class="dot dot-correct"></div>
      <div class="dot dot-current"></div>
      <div class="dot dot-next"></div>
      <div class="dot dot-next"></div>
      <div class="dot dot-next"></div>
      <div class="dot dot-next"></div>
      <div class="dot dot-next"></div>
      <div class="dot dot-next"></div>
    </div>

    <span class="round-label">Round 4</span>
  </header>

  <div class="game-prompt">Which is more popular?</div>

  <main>
    <!-- Left Card: Rendang -->
    <div class="food-card">
      <!--
        Image source: copy rendang.png from
        artifacts/mockup-sandbox/public/images/rendang.png
        into an images/ folder next to this file.
      -->
      <img src="images/rendang.png" alt="Rendang" />
      <div class="card-gradient"></div>
      <span class="region-badge">West Sumatra</span>
      <div class="card-info">
        <h2>Rendang</h2>
        <p>Slow-cooked beef in rich coconut-spice sauce.</p>
      </div>
    </div>

    <div class="vs-badge">VS</div>

    <!-- Right Card: Gado-Gado -->
    <div class="food-card">
      <img src="images/gadogado.png" alt="Gado-Gado" />
      <div class="card-gradient"></div>
      <span class="region-badge">West Java</span>
      <div class="card-info">
        <h2>Gado-Gado</h2>
        <p>Fresh vegetables with peanut sauce and crackers.</p>
      </div>
    </div>
  </main>
</body>
</html>
