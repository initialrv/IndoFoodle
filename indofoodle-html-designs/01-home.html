<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>IndoFoodle — Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #1A0E07;
      --surface:  #2A1608;
      --surface2: #3A2010;
      --text:     #F0E0C8;
      --muted:    #8A6545;
      --primary:  #E63946;
      --accent:   #F4A261;
      --border:   #4A2E18;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      width: 1280px;
      height: 800px;
      overflow: hidden;
      position: relative;
    }

    /* Wood-grain texture */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        92deg,
        transparent,
        transparent 2px,
        rgba(255,255,255,0.018) 2px,
        rgba(255,255,255,0.018) 3px
      );
      pointer-events: none;
      z-index: 0;
    }

    /* ── Header ── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 1;
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      background: var(--primary);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(230,57,70,0.4);
    }

    .logo-mark span {
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      font-style: italic;
      font-family: Georgia, serif;
    }

    .logo-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .streak-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .streak-pill .icon {
      color: var(--accent);
      font-size: 16px;
    }

    /* ── Main ── */
    main {
      display: flex;
      align-items: center;
      justify-content: center;
      height: calc(800px - 77px);
      position: relative;
      z-index: 1;
    }

    .center-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 480px;
      animation: fadeUp 0.5s ease-out both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .big-logo {
      width: 112px;
      height: 112px;
      background: var(--primary);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(3deg);
      box-shadow: 0 20px 60px rgba(230,57,70,0.35);
      margin-bottom: 32px;
    }

    .big-logo span {
      color: #fff;
      font-size: 52px;
      font-weight: 900;
      font-style: italic;
      font-family: Georgia, serif;
      transform: rotate(-3deg);
      display: inline-block;
    }

    h1 {
      font-size: 60px;
      font-weight: 900;
      letter-spacing: -2px;
      margin-bottom: 14px;
      line-height: 1;
    }

    .tagline {
      color: var(--muted);
      font-size: 20px;
      line-height: 1.5;
      margin-bottom: 40px;
    }

    .tagline strong {
      color: var(--text);
      font-weight: 600;
    }

    /* ── Stats ── */
    .stats {
      display: flex;
      align-items: center;
      gap: 48px;
      margin-bottom: 44px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .stat-value {
      font-size: 40px;
      font-weight: 900;
      line-height: 1;
    }

    .stat-value.accent { color: var(--accent); }

    .stat-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    .stat-divider {
      width: 1px;
      height: 40px;
      background: var(--border);
    }

    /* ── Buttons ── */
    .actions {
      display: flex;
      gap: 16px;
      width: 100%;
    }

    .btn-primary {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--primary);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 17px;
      font-weight: 700;
      border: none;
      border-radius: 16px;
      padding: 18px 24px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(230,57,70,0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(230,57,70,0.45);
    }

    .btn-primary svg { flex-shrink: 0; }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 17px;
      font-weight: 600;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 32px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-secondary:hover { background: #4A2E18; }

    /* ── Blobs ── */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    .blob-1 {
      width: 400px; height: 400px;
      background: var(--accent);
      opacity: 0.05;
      top: -80px; right: -80px;
    }

    .blob-2 {
      width: 400px; height: 400px;
      background: var(--primary);
      opacity: 0.05;
      bottom: -100px; left: -100px;
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <header>
    <div class="logo-row">
      <div class="logo-mark"><span>iF</span></div>
      <span class="logo-name">IndoFoodle</span>
    </div>
    <div class="streak-pill">
      <span class="icon">🏆</span>
      <span>7 day streak</span>
    </div>
  </header>

  <main>
    <div class="center-block">
      <div class="big-logo"><span>iF</span></div>
      <h1>IndoFoodle</h1>
      <p class="tagline">
        Which Indonesian dish do people love more?<br>
        <strong>10 matchups. One daily challenge.</strong>
      </p>

      <div class="stats">
        <div class="stat">
          <span class="stat-value">7</span>
          <span class="stat-label">Day Streak</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <span class="stat-value">42</span>
          <span class="stat-label">Played</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <span class="stat-value accent">73%</span>
          <span class="stat-label">Accuracy</span>
        </div>
      </div>

      <div class="actions">
        <button class="btn-primary">
          Play Today's Challenge
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <button class="btn-secondary">Practice Mode</button>
      </div>
    </div>
  </main>
</body>
</html>
