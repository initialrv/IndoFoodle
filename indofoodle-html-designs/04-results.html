<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>IndoFoodle — Results</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #1A0E07;
      --surface:  #2A1608;
      --surface2: #3A2010;
      --text:     #F0E0C8;
      --muted:    #8A6545;
      --primary:  #E63946;
      --accent:   #F4A261;
      --border:   #4A2E18;
      --correct:  #4CAF50;
      --wrong:    #EF4444;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      width: 1280px;
      height: 800px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 40px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .menu-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .summary-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
    }

    /* All dots complete — all green or red, no current */
    .progress-dots {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot { border-radius: 50%; flex-shrink: 0; }
    .dot-correct { width: 10px; height: 10px; background: var(--correct); }
    .dot-wrong   { width: 10px; height: 10px; background: var(--wrong); }

    /* ── Main layout ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 60px;
      animation: fadeUp 0.5s ease-out both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .content-row {
      display: flex;
      gap: 48px;
      align-items: center;
      width: 100%;
      max-width: 1060px;
    }

    /* ── Left: Score ── */
    .score-block {
      flex: 1;
    }

    .daily-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .score-block h1 {
      font-size: 56px;
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1;
      margin-bottom: 10px;
    }

    .streak-tag {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 28px;
    }

    .score-display {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 28px;
    }

    .score-big {
      font-size: 100px;
      font-weight: 900;
      line-height: 1;
      color: var(--correct);
    }

    .score-slash {
      font-size: 40px;
      font-weight: 700;
      color: var(--muted);
    }

    .score-total {
      font-size: 52px;
      font-weight: 900;
      color: var(--text);
      opacity: 0.35;
    }

    .score-word {
      font-size: 20px;
      font-weight: 600;
      color: var(--muted);
      align-self: flex-end;
      padding-bottom: 10px;
      margin-left: 4px;
    }

    /* Result grid */
    .result-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      max-width: 280px;
      margin-bottom: 24px;
    }

    .grid-cell {
      width: 36px;
      height: 36px;
      border-radius: 8px;
    }

    .grid-cell.correct { background: var(--correct); }
    .grid-cell.wrong   { background: var(--wrong); }

    .countdown {
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
    }

    .countdown span {
      font-family: 'DM Sans', monospace;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.06em;
    }

    /* ── Divider ── */
    .divider {
      width: 1px;
      align-self: stretch;
      background: var(--border);
    }

    /* ── Right: Actions ── */
    .actions-block {
      width: 340px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 6px;
    }

    .result-card-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    .result-row:last-child { border-bottom: none; }
    .result-row .rkey { color: var(--muted); }
    .result-row .rval { font-weight: 700; }
    .result-row .rval.green { color: var(--correct); }
    .result-row .rval.orange { color: var(--accent); }

    button {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      border-radius: 14px;
      padding: 16px 20px;
      cursor: pointer;
      border: none;
      transition: transform 0.15s ease;
    }

    button:hover { transform: translateY(-1px); }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 6px 20px rgba(230,57,70,0.35);
    }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border) !important;
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border) !important;
      font-weight: 600;
    }

    .btn-ghost:hover { color: var(--text); }
  </style>
</head>
<body>
  <header>
    <button class="menu-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Menu
    </button>

    <!-- All 10 rounds complete: correct/wrong pattern -->
    <div class="progress-dots">
      <div class="dot dot-correct"></div>
      <div class="dot dot-correct"></div>
      <div class="dot dot-wrong"></div>
      <div class="dot dot-correct"></div>
      <div class="dot dot-correct"></div>
      <div class="dot dot-wrong"></div>
      <div class="dot dot-correct"></div>
      <div class="dot dot-correct"></div>
      <div class="dot dot-correct"></div>
      <div class="dot dot-wrong"></div>
    </div>

    <span class="summary-label">Summary</span>
  </header>

  <main>
    <div class="content-row">

      <!-- Left: Score -->
      <div class="score-block">
        <div class="daily-label">Daily Complete</div>
        <h1>IndoFoodle</h1>
        <div class="streak-tag">🔥 7 day streak</div>

        <div class="score-display">
          <span class="score-big">7</span>
          <span class="score-slash">/</span>
          <span class="score-total">10</span>
          <span class="score-word">correct</span>
        </div>

        <div class="result-grid">
          <div class="grid-cell correct"></div>
          <div class="grid-cell correct"></div>
          <div class="grid-cell wrong"></div>
          <div class="grid-cell correct"></div>
          <div class="grid-cell correct"></div>
          <div class="grid-cell wrong"></div>
          <div class="grid-cell correct"></div>
          <div class="grid-cell correct"></div>
          <div class="grid-cell correct"></div>
          <div class="grid-cell wrong"></div>
        </div>

        <div class="countdown">Next challenge in <span>14:32:05</span></div>
      </div>

      <div class="divider"></div>

      <!-- Right: Actions -->
      <div class="actions-block">
        <div class="result-card">
          <div class="result-card-label">Your Result</div>
          <div class="result-row">
            <span class="rkey">Score</span>
            <span class="rval">7 / 10</span>
          </div>
          <div class="result-row">
            <span class="rkey">Accuracy</span>
            <span class="rval green">70%</span>
          </div>
          <div class="result-row">
            <span class="rkey">Streak</span>
            <span class="rval orange">🔥 7 days</span>
          </div>
        </div>

        <button class="btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          Share Result
        </button>
        <button class="btn-secondary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.08"/></svg>
          Play Practice Mode
        </button>
        <button class="btn-ghost">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Back to Menu
        </button>
      </div>

    </div>
  </main>
</body>
</html>
